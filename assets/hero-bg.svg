<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="320" fill="#020617"/>

  <circle cx="240" cy="120" r="170" fill="#2563EB" opacity="0.35">
    <animate attributeName="cx" values="180;320;180" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;180;100" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="890" cy="170" r="210" fill="#7C3AED" opacity="0.32">
    <animate attributeName="cx" values="940;780;940" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;220;140" dur="11s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="70" r="130" fill="#38BDF8" opacity="0.18">
    <animate attributeName="cy" values="60;170;60" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="50%" y="43%" text-anchor="middle" fill="#FFFFFF" font-size="54" font-family="Inter, Arial, sans-serif" font-weight="700">
    Apurva Shelar
  </text>

  <text x="50%" y="60%" text-anchor="middle" fill="#CBD5E1" font-size="20" font-family="Inter, Arial, sans-serif">
