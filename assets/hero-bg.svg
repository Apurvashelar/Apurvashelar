<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Soft blur filter for moving blobs -->
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-width="0.45" opacity="0.08"/>
    </pattern>

    <!-- Text glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="330" rx="0" fill="url(#bgGradient)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="330" fill="url(#grid)" opacity="0.7"/>

  <!-- Animated background blobs -->
  <g filter="url(#blur)">
    <circle cx="210" cy="105" r="145" fill="#2563EB" opacity="0.34">
      <animate attributeName="cx" values="190;320;250;190" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;150;210;90" dur="13s" repeatCount="indefinite"/>
    </circle>

    <circle cx="940" cy="170" r="185" fill="#7C3AED" opacity="0.32">
      <animate attributeName="cx" values="940;800;1020;940" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;235;120;150" dur="15s" repeatCount="indefinite"/>
    </circle>

    <circle cx="600" cy="70" r="120" fill="#38BDF8" opacity="0.16">
      <animate attributeName="cy" values="60;145;75;60" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="560;650;610;560" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="730" cy="270" r="135" fill="#14B8A6" opacity="0.13">
      <animate attributeName="cx" values="700;820;680;700" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;205;285;260" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Soft vignette -->
  <rect width="1200" height="330" fill="#020617" opacity="0.22"/>

  <!-- Decorative small particles -->
  <g opacity="0.55">
    <circle cx="145" cy="245" r="2" fill="#CBD5E1">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="65" r="1.7" fill="#93C5FD">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="260" r="1.8" fill="#C4B5FD">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="80" r="2" fill="#BAE6FD">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="250" r="1.9" fill="#DDD6FE">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main text -->
  <text
    x="50%"
    y="43%"
    text-anchor="middle"
    fill="#FFFFFF"
    font-size="56"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-weight="750"
    letter-spacing="0.5"
    filter="url(#textGlow)"
  >
    Apurva Shelar
  </text>

  <!-- Static subtitle -->
  <text
    x="50%"
    y="60%"
    text-anchor="middle"
    fill="#CBD5E1"
    font-size="20"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-weight="500"
    letter-spacing="0.3"
  >
    Full-Stack Software Engineer · Healthcare Systems · Applied AI Builder
  </text>

  <!-- Bottom accent line -->
  <rect x="390" y="232" width="420" height="2" rx="1" fill="url(#accentGradient)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
  </rect>

  <defs>
    <linearGradient id="accentGradient" x1="390" y1="0" x2="810" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
</svg>
